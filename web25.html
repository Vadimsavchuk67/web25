<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота 25</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        input {
            width: 120px;
            padding: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 16px;
            padding: 8px 16px;
            font-size: 16px;
        }

        #history {
            max-width: 420px;
            min-height: 40px;
            border: 1px solid #888;
            padding: 12px 12px 12px 32px;
        }

        #history li {
            margin: 6px 0;
        }
    </style>
</head>
<body>
    <h1>Калькулятор суми</h1>
    <div>
        <input type="text" id="value1" aria-label="Перше число">
        <span>+</span>
        <input type="text" id="value2" aria-label="Друге число">
        <span>=</span>
        <span id="result"></span>
    </div>
    <button id="calculate" onclick="calculate()">Порахувати</button>
    <h2>Історія</h2>
    <ul id="history"></ul>
    <script src="web25.js"></script>
</body>
</html>
